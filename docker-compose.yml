version: "3.8"

services:
  web:
    labels:
      - "hub.enable=true"
      - "hub.name=Dos Tazas Management"
      - "hub.port=5174"
      - "hub.tags=Dev"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
